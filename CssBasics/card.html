<!doctype html>
<html>
  <head>
    <title>Creating Cards in HTML</title>
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="card">
      <img src="man.png" alt="man" />
      <div class="desc">
        <h3>Rahul Kumar</h3>
        <p>Data Analyst</p>
      </div>
    </div>
    <div class="card">
      <img src="female.png" alt="woman" />
      <div class="desc">
        <h3>Neha Sharma</h3>
        <p>Software Engineer</p>
      </div>
    </div>
  </body>
</html>
