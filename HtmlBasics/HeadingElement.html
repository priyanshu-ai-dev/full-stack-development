<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading Tag</title>
</head>
<body>
    <h1>Main Heading</h1>
    <h2>Sub Heading</h2>
    <h3>Next Sub Heading</h3>
    <h4>
        Next to Next Sub Heading
    </h4>
    <h5>Next-3 Sub Heading</h5>
    <h5>Next-4 Sub Heading</h5>
    <h6>Next-5 Sub Heading</h6>
    <p>h6 is the smallest heading tag.</p>

</body>
</html>
