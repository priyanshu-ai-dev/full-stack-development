<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special HTML Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="/server" >
        <div>
         <label for="name"></label>
        <input type="text" placeholder="First Name" id="name" name="name" />
        <label for="title"></label>
        <input type="text" placeholder="Last Name" id="title" name="title" />
        </div>
        <div>
        <label for="gender">Please Select Gender</label>
        <select id="gender" name="gender" >
            <option value="M">Male</option>
            <option value="F">Female</option>
        </select>
        </div>
        <div>
        <label for="terms">Do you agree to all terms of services?</label>
        <input type="checkbox" id="terms" name="terms" />
        <label for="terms">Yes, I agree</label>
        </div>
        <button type="submit">Register</button>
    </form>
</body>
</html>
