<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <h2>Feedback Form </h2>
    <form action="/server">
        <div>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Write your name" name="name" />
        </div>
        <br>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Write your email" name="email"/>
        </div>
        <br>
        <div>
        <label for="feedback">Message:</label>
        <br>
        <textarea id="feedback" name="feedback" ></textarea>
        </div>
        <br>
        <div>
        <label for="rating">Rate us out of 5:</label>
        <br>
        <input type="radio" name="rating" id="one" value="one" />
        <label for="apple">1</label>
        <br>
        <input type="radio" name="rating" id="two" value="two" />
        <label for="two">2</label>
        <br>
        <input type="radio" name="rating" id="three" value="three" />
        <label for="three">3</label>
        <br>
        <input type="radio" name="rating" id="four" value="four" />
        <label for="three">4</label>
        <br>
        <input type="radio" name="rating" id="five" value="five" />
        <label for="three">5</label>
        </div>
        <br>
        <div>
            <button type="submit">Send your message!</button>
        </div>
    </form>
</body>
</html>
